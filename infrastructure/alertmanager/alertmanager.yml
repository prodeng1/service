global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 30m
  receiver: 'warning-email'
  routes:
    - match:
        severity: critical
      receiver: 'critical-email'
      repeat_interval: 5m
    - match:
        severity: warning
      receiver: 'warning-email'
      repeat_interval: 30m

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alert_group']

receivers:
- name: 'critical-email'
  email_configs:
  - to: 'critical-alerts@example.com'
    from: 'alerts@example.com'
    smarthost: smtp.gmail.com:587
    auth_username: 'alerts@example.com'
    auth_identity: 'alerts@example.com'
    auth_password: 'REPLACE_WITH_APP_PASSWORD_OR_SMTP_TOKEN'
    headers:
      Subject: '[CRITICAL] {{ .GroupLabels.alertname }}'

- name: 'warning-email'
  email_configs:
  - to: 'warning-alerts@example.com'
    from: 'alerts@example.com'
    smarthost: smtp.gmail.com:587
    auth_username: 'alerts@example.com'
    auth_identity: 'alerts@example.com'
    auth_password: 'REPLACE_WITH_APP_PASSWORD_OR_SMTP_TOKEN'
    headers:
      Subject: '[WARNING] {{ .GroupLabels.alertname }}'
