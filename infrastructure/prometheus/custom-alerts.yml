groups:
  - name: CustomAlerts
    rules:
      # --- Availability ---
      - alert: WARNING-ServiceHealthCheckFailing
        expr: up{job="spring-prod-eng-app"} == 0
        for: 30s
        labels:
          severity: warning
          category: availability
          alert_group: service-health
        annotations:
          summary: "Service health check failing (instance {{ $labels.instance }})"
          description: "The spring-prod-eng-app target has been unreachable for more than 30 seconds.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: CRITICAL-ServiceHealthCheckFailing
        expr: up{job="spring-prod-eng-app"} == 0
        for: 90s
        labels:
          severity: critical
          category: availability
          alert_group: service-health
        annotations:
          summary: "Service health check critically failing (instance {{ $labels.instance }})"
          description: "The spring-prod-eng-app target has been unreachable for more than 90 seconds.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      # --- Performance ---
      - alert: WARNING-HighRequestLatency
        expr: rate(http_server_requests_seconds_sum{uri!~"/actuator.*"}[5m]) / rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
          category: performance
          alert_group: request-latency
        annotations:
          summary: "High average request latency on {{ $labels.uri }}"
          description: "Average request latency exceeds 500ms over the last 5 minutes.\n  VALUE = {{ $value }}s\n  LABELS = {{ $labels }}"

      - alert: CRITICAL-HighRequestLatency
        expr: rate(http_server_requests_seconds_sum{uri!~"/actuator.*"}[5m]) / rate(http_server_requests_seconds_count{uri!~"/actuator.*"}[5m]) > 2
        for: 2m
        labels:
          severity: critical
          category: performance
          alert_group: request-latency
        annotations:
          summary: "Critical request latency on {{ $labels.uri }}"
          description: "Average request latency exceeds 2 seconds over the last 5 minutes.\n  VALUE = {{ $value }}s\n  LABELS = {{ $labels }}"

      # --- Quality ---
      - alert: WARNING-HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 2m
        labels:
          severity: warning
          category: quality
          alert_group: error-rate
        annotations:
          summary: "High error rate detected"
          description: "More than 5% of requests are returning 5xx errors over the last 5 minutes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

      - alert: CRITICAL-HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.2
        for: 2m
        labels:
          severity: critical
          category: quality
          alert_group: error-rate
        annotations:
          summary: "Critical error rate detected"
          description: "More than 20% of requests are returning 5xx errors over the last 5 minutes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"
